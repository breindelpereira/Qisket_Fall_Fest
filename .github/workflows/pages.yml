# Builds the website and publishes it to GitHub Pages.
# One-time setup: in the repository, Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Then open the Actions tab, pick "Publish website" and press "Run workflow". It runs only when started by hand,
# so a repository without Pages switched on never shows a failed run.
name: Publish website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # ./ makes every address in the build relative, so the site works from /Qisket_Fall_Fest/
      - run: npm run build
        env:
          VITE_BASE: ./
      - run: npm run check:no-keys
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
